name: Kistly veroeffentlichen

# Baut die App bei jedem Push auf main und legt sie auf GitHub Pages.
# Die Adressen stehen als Repository-Variablen, nicht im Code, damit man
# das Supabase-Projekt wechseln kann, ohne etwas umzuschreiben.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Konfiguration pruefen
        # Fehlen die Variablen, baut Vite still eine App, die beim Start nur
        # den Hinweis auf die fehlende Konfiguration zeigt. Lieber hier laut
        # abbrechen als eine tote Seite veroeffentlichen.
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "VITE_SUPABASE_URL oder VITE_SUPABASE_ANON_KEY fehlt."
            echo "Unter Settings, Secrets and variables, Actions, Variables setzen."
            exit 1
          fi
          echo "Supabase: $URL"

      - run: npm ci

      - name: Bauen
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Rueckfall fuer tiefe Adressen
        # GitHub Pages kennt keine Umschreibung auf index.html. Ohne diese
        # Kopie liefert ein Aufruf von /kistly/app/scan einen 404 statt der App.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
